<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Player Dashboard</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./frontend/increase.png">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.3/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Nhúng FontAwesome để thêm icon sinh động -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./frontend/style.css">

    <style>
        /* Tối ưu hóa padding đáy cho trang web không bị thanh bottom đè */
        body.pm-body {
            padding-bottom: 120px;
        }

        .control-bar-input {
            max-width: 110px;
        }
    </style>
</head>

<body class="pm-body">

    <main class="container-fluid">



        <div class="row">
            <div class="col-9 ">
                <div class="container">
                    <div class="row charts-wrapper"> </div>
                </div>
            </div>

            <div class="col-3">

<div class="container-fluid p-0">
    <div class="card shadow-sm border-light-subtle" style="font-size: 13px;">
        
        <!-- HEADER FORM -->
        <div class="card-header bg-white py-2 px-3 border-bottom d-flex align-items-center justify-content-between">
            <div class="fw-bold text-dark">
                <i class="fa-solid fa-server text-warning me-1.5"></i>Control Panel
            </div>
            <!-- Player Name -->
            <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2.5 py-1 rounded-pill">
                <i class="fa-solid fa-user me-1"></i><span data-prop="_name">Player</span>
            </span>
        </div>

        <!-- BODY FORM -->
        <div class="card-body p-2 d-flex flex-column gap-2">
            
            <!-- DÒNG 1: Status badge & Asset Gold -->
            <div class="d-flex align-items-center justify-content-between gap-2">
                <div class="d-flex align-items-center gap-1.5">
                    <span class="fw-semibold text-secondary">Status:</span>
                    <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1 rounded-pill">
                        <i class="fa-solid fa-circle fa-2xs me-1"></i><span data-prop="_responseCount">0</span>/30
                    </span>
                </div>
                <div class="d-flex align-items-center gap-1.5 bg-light px-2 py-1 rounded border">
                    <i class="fa-solid fa-coins text-warning"></i>
                    <span class="text-secondary fw-semibold">Gold:</span>
                    <span class="fw-bold text-dark" data-prop="_gold">0</span>
                </div>
            </div>

            <!-- DÒNG 2: Toggles Python & Game Server -->
            <div class="d-flex align-items-center justify-content-between gap-2">
                <!-- Python Toggle -->
                <div class="d-flex align-items-center justify-content-between bg-light px-2 py-1 rounded border flex-fill">
                    <div class="d-flex align-items-center gap-1">
                        <i class="fa-solid fa-brain text-info"></i>
                        <span class="fw-semibold text-secondary">Py:</span>
                    </div>
                    <div class="form-check form-switch m-0 p-0" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isPythonConnected" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>
                <!-- Game Toggle -->
                <div class="d-flex align-items-center justify-content-between bg-light px-2 py-1 rounded border flex-fill">
                    <div class="d-flex align-items-center gap-1">
                        <i class="fa-solid fa-gamepad text-warning"></i>
                        <span class="fw-semibold text-secondary">Game:</span>
                    </div>
                    <div class="form-check form-switch m-0 p-0" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isGameConnected" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>
            </div>

            <!-- DÒNG 3: Token Input -->
            <div class="d-flex align-items-center gap-2">
                <a href="./stk" target="_blank" class="text-dark text-decoration-none fw-semibold text-nowrap" title="Access Token">
                    <i class="fa-solid fa-key text-warning me-1"></i>Token:
                </a>
                <input type="text" class="form-control form-control-sm px-2 py-1 blur"
                    data-prop="_token" oninput="handleInputChange(this)" placeholder="Nhập token..."
                    >
            </div>

            <!-- DÒNG 4: Messages (Nén ngắn) -->
            <div class="d-flex align-items-center gap-2 bg-light rounded px-2 py-1 border">
                <i class="fa-solid fa-comments text-secondary"></i>
                <span class="fw-semibold text-secondary text-nowrap">Msg:</span>
                <div class="text-truncate small text-muted flex-grow-1" data-prop="_messages" title="Messages">No messages</div>
            </div>

            <!-- DÒNG 5: Market History (Nén ngắn) -->
            <div class="d-flex align-items-center gap-2 bg-light rounded px-2 py-1 border">
                <i class="fa-solid fa-clock-rotate-left text-secondary"></i>
                <span class="fw-semibold text-secondary text-nowrap">Market:</span>
                <div class="text-truncate small text-muted flex-grow-1" data-prop="_history" title="Market">No information</div>
            </div>

        </div>
    </div>
</div>

                
                <div class="table-responsive" id="DOM_table">
                    <table id="tradeTable" class="table table-sm table-borderless m-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Buy</th>
                                <th>Mat</th>
                                <th>Sel</th>
                                <th>Mat</th>
                                <th>Ses</th>
                                <th>Net</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>




    </main>



    <script>
        // Hàm Toggle chuyển đổi giữa Khối 1 và Khối 2+3
        function toggleItemView(index) {
            console.log(index)
            const block1 = document.getElementById(`block1_${index}`);
            const block2and3 = document.getElementById(`block2and3_${index}`);

            if (block1 && block2and3) {
                block1.classList.toggle('d-none');
                block2and3.classList.toggle('d-none');

                // Resize lại chart khi thẻ được hiển thị ra để tránh méo biểu đồ
                if (window.echarts) {
                    const chart1 = echarts.getInstanceByDom(document.getElementById(`gameChart_${index}`));
                    const chart2 = echarts.getInstanceByDom(document.getElementById(`rawScoreChart_${index}`));
                    if (chart1) chart1.resize();
                    if (chart2) chart2.resize();
                }
            }
        }
    </script>

    <script src="./frontend/a_globalfunc.js"></script>
    <script src="./frontend/b_echart.js"></script>
    <script src="./frontend/new.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
