<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Player Dashboard</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./frontend/increase.png">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.3/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Nhúng FontAwesome để thêm icon sinh động -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./frontend/style.css">

    <style>
        /* Tối ưu hóa padding đáy cho trang web không bị thanh bottom đè */
        body.pm-body {
            padding-bottom: 120px;
        }
        .control-bar-input {
            max-width: 110px;
        }
    </style>
</head>

<body class="pm-body">

    <main >
        <div class="container">
            <div class="row charts-wrapper">

            </div>

        </div>

        <!-- tradeTable -->
        <div class="container-fluid p-0 mb-4" id="DOM_table">
            <div class="table-responsive">
                <table id="tradeTable" class="table table-sm table-borderless m-0">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Buy</th>
                            <th>Match</th>
                            <th>Sell</th>
                            <th>Match</th>
                            <th>Market</th>
                            <th>Sessionp</th>
                            <th>Netp</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- BOTTOM CONTROL BAR (Cố định ở đáy, sắp xếp dạng ngang thon gọn) -->
<!-- BOTTOM CONTROL BAR (Rộng rãi, thoáng, dễ nhìn) -->
<div class="position-fixed bottom-0 start-0 end-0 bg-white border-top shadow-lg z-3 py-2 px-3">
    <div class="container-fluid p-0">
        <div class="d-flex flex-column gap-2 text-nowrap" style="font-size: 13px;">
            
            <!-- HÀNG 1: SYSTEM MANAGER -->
            <div class="d-flex align-items-center justify-content-between gap-4 overflow-x-auto pb-1 border-bottom border-light-subtle">
                
                <!-- System Title & Status -->
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold text-dark fs-6">
                        <i class="fa-solid fa-server text-warning me-1"></i>System:
                    </span>
                    <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2.5 py-1.5 rounded-pill">
                        <i class="fa-solid fa-circle fa-2xs me-1"></i><span data-prop="_responseCount">0</span>
                    </span>
                </div>

                <!-- Access Token Input -->
                <div class="d-flex align-items-center gap-2 ms-2">
                    <a href="./stk" target="_blank" class="text-dark text-decoration-none fw-semibold" title="Access Token">
                        <i class="fa-solid fa-key text-warning me-1"></i>Token:
                    </a>
                    <input type="text" class="form-control form-control-sm px-2 py-1" style="width: 160px;"
                        data-prop="_token" oninput="handleInputChange(this)" placeholder="Nhập token...">
                </div>

                <!-- Python Server Toggle -->
                <div class="d-flex align-items-center gap-2 bg-light px-2.5 py-1 rounded border">
                    <i class="fa-solid fa-brain text-info"></i>
                    <span class="fw-semibold text-secondary">Python:</span>
                    <div class="form-check form-switch m-0 p-0 ms-1" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isPythonConnected" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>

                <!-- Game Server Toggle -->
                <div class="d-flex align-items-center gap-2 bg-light px-2.5 py-1 rounded border">
                    <i class="fa-solid fa-gamepad text-warning"></i>
                    <span class="fw-semibold text-secondary">Game:</span>
                    <div class="form-check form-switch m-0 p-0 ms-1" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isGameConnected" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>

                <!-- Messages -->
                <div class="d-flex align-items-center gap-2 bg-light rounded px-2.5 py-1 border flex-grow-1" style="max-width: 280px;">
                    <i class="fa-solid fa-comments text-secondary"></i>
                    <span class="fw-semibold text-secondary me-1">Msg:</span>
                    <div class="text-truncate small text-muted flex-grow-1" data-prop="_messages" title="Messages">No messages</div>
                </div>

                <!-- Market History -->
                <div class="d-flex align-items-center gap-2 bg-light rounded px-2.5 py-1 border flex-grow-1" style="max-width: 280px;">
                    <i class="fa-solid fa-clock-rotate-left text-secondary"></i>
                    <span class="fw-semibold text-secondary me-1">Market:</span>
                    <div class="text-truncate small text-muted flex-grow-1" data-prop="_history" title="Market">No information</div>
                </div>

            </div>

            <!-- HÀNG 2: PLAYER INFO & TRADING CONTROLS -->
            <div class="d-flex align-items-center justify-content-between gap-4 overflow-x-auto pt-1">
                
                <!-- Player Name -->
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-1.5 rounded-pill fs-6">
                        <i class="fa-solid fa-user me-1.5"></i><span data-prop="_name">Player</span>
                    </span>
                </div>

                <!-- Asset Gold -->
                <div class="d-flex align-items-center gap-2 bg-light px-3 py-1 rounded border">
                    <i class="fa-solid fa-coins text-warning fs-6"></i>
                    <span class="text-secondary fw-semibold">Asset:</span>
                    <span class="fw-bold text-dark fs-6" data-prop="_gold">0</span>
                </div>

                <!-- Play Status Switch -->
                <div class="d-flex align-items-center gap-2 bg-light px-2.5 py-1 rounded border">
                    <i class="fa-solid fa-play text-success"></i>
                    <span class="fw-semibold text-secondary">Play:</span>
                    <div class="form-check form-switch m-0 p-0 ms-1" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isPlay" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>

                <!-- Reverse Switch -->
                <div class="d-flex align-items-center gap-2 bg-light px-2.5 py-1 rounded border">
                    <i class="fa-solid fa-right-left text-danger"></i>
                    <span class="fw-semibold text-secondary">Reverse:</span>
                    <div class="form-check form-switch m-0 p-0 ms-1" style="min-height: auto;">
                        <input class="form-check-input m-0" type="checkbox" role="switch" data-prop="_isReverse" onchange="handleToggleChange(this)" style="cursor: pointer;">
                    </div>
                </div>

                <!-- Signal & Bet -->
                <div class="d-flex align-items-center gap-2 px-2 py-1">
                    <span class="badge bg-secondary-subtle text-secondary px-2 py-1 fw-semibold" data-prop="_signal" style="letter-spacing: 0.5px;">HOLD</span>
                    <span class="fw-bold font-monospace text-dark fs-6" data-prop="_bet">0</span>
                </div>

                <!-- Volume Input -->
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-semibold text-secondary">Vol:</span>
                    <input type="number" class="form-control form-control-sm px-2 py-1 text-end fw-bold text-success" style="width: 100px;"
                        id="_volume" value="10000" step="5000">
                </div>

                <!-- TP & SL Inputs -->
                <div class="d-flex align-items-center gap-3 bg-light px-3 py-1 rounded border">
                    <div class="d-flex align-items-center gap-1">
                        <span class="text-success fw-bold">TP:</span>
                        <input type="number" class="form-control form-control-sm px-2 py-1 text-end fw-bold text-success" style="width: 110px;"
                            data-prop="_tp" oninput="handleInputChange(this)" value="10000000" step="500000">
                    </div>
                    
                    <div class="d-flex align-items-center gap-1">
                        <span class="text-danger fw-bold">SL:</span>
                        <input type="number" class="form-control form-control-sm px-2 py-1 text-end fw-bold text-danger" style="width: 100px;"
                            data-prop="_sl" oninput="handleInputChange(this)" value="0" step="500000">
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

    </main>

    <script>
        // Hàm Toggle chuyển đổi giữa Khối 1 và Khối 2+3
        function toggleItemView(index) {
            console.log(index)
            const block1 = document.getElementById(`block1_${index}`);
            const block2and3 = document.getElementById(`block2and3_${index}`);

            if (block1 && block2and3) {
                block1.classList.toggle('d-none');
                block2and3.classList.toggle('d-none');

                // Resize lại chart khi thẻ được hiển thị ra để tránh méo biểu đồ
                if (window.echarts) {
                    const chart1 = echarts.getInstanceByDom(document.getElementById(`gameChart_${index}`));
                    const chart2 = echarts.getInstanceByDom(document.getElementById(`rawScoreChart_${index}`));
                    if (chart1) chart1.resize();
                    if (chart2) chart2.resize();
                }
            }
        }
    </script>

    <script src="./frontend/a_globalfunc.js"></script>
    <script src="./frontend/b_echart.js"></script>
    <script src="./frontend/new.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
