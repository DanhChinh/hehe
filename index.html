<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Player Dashboard</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./frontend/increase.png">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.3/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Nhúng FontAwesome để thêm icon sinh động -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="./frontend/style.css">


</head>

<body class="pm-body">

  <main class="main-wrapper container py-4">
    <div class="row g-4">

      <!-- Cột bên trái: Dashboard & Map -->
      <div class="col-lg-9">

        <div class="charts-wrapper">
          <!-- CARD 1: BIỂU ĐỒ TỔNG CỘNG DỒN (CỦA BẠN) -->
          <!-- CARD 2: BIỂU ĐỒ ĐIỂM TỪNG VÁN (TẠO MỚI) -->

        </div>


        <!-- tradeTable -->
        <div class="container-fluid p-0" id="DOM_table">
          <div class="table-responsive">
            <table id="tradeTable" class="table table-sm table-borderless m-0">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Buy</th>
                  <th>Match</th>
                  <th>Sell</th>
                  <th>Match</th>
                  <th>Market</th>
                  <th>Sessionp</th>
                  <th>Netp</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>

        </div>
      </div>

      <!-- Cột bên phải: Tách thành 2 khối riêng biệt (Player phía trên, System phía dưới) -->
      <div class="col-lg-3 d-flex flex-column gap-4">
        <!-- 2. KHỐI SYSTEM (HỆ THỐNG / KẾT NỐI) -->
        <div class="container p-0 ">
          <div class="card pm-card p-4">

            <div class="pm-header d-flex justify-content-between align-items-center">
              <div>
                <h4 class="fw-bold text-dark m-0"><i class="fa-solid fa-server text-warning me-2"></i>System Manager
                </h4>
                <small class="text-secondary">Network Connection & Status Management</small>
              </div>
              <span
                class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2 rounded-pill">
                <i class="fa-solid fa-circle fa-2xs me-1"></i>
                <span data-prop="_responseCount">0</span>
              </span>
            </div>

            <div class="list-group list-group-flush bg-transparent">
              <!-- Token (Ô input hiển thị/nhập token) -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-key me-2 text-warning"></i>
                  <a href="./stk" target="_blank" rel="noopener noreferrer">
                    Access Token
                  </a>
                </span>
                <input type="text"
                  class="form-control form-control-sm bg-white text-dark border-light-subtle text-end w-50"
                  data-prop="_token" oninput="handleInputChange(this)" placeholder="Nhập token...">
              </div>

              <!-- Python Server -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-brain me-2 text-info"></i>Python Server</span>
                <label class="pm-switch mb-0">
                  <input type="checkbox" data-prop="_isPythonConnected" onchange="handleToggleChange(this)">
                  <span class="pm-slider"></span>
                </label>
              </div>

              <!-- Game Server -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-gamepad me-2 text-warning"></i>Game Server</span>
                <label class="pm-switch mb-0">
                  <input type="checkbox" data-prop="_isGameConnected" onchange="handleToggleChange(this)">
                  <span class="pm-slider"></span>
                </label>
              </div>


              <!-- Tin nhắn hệ thống -->
              <div class="list-group-item pm-item py-3 px-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="text-dark"><i class="fa-solid fa-comments me-2"></i>Messages</span>
                </div>
                <div
                  class="p-2 rounded bg-black bg-opacity-25 border border-secondary border-opacity-10 text-white small"
                  data-prop="_messages" style="max-height: 90px; overflow-y: auto;">
                  No messages
                </div>
              </div>

              <!-- Lich su hệ thống -->
              <div class="list-group-item pm-item py-3 px-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="text-dark"><i class="fa-solid fa-clock-rotate-left me-2"></i>Market</span>
                </div>
                <div
                  class="p-2 rounded bg-black bg-opacity-25 border border-secondary border-opacity-10 text-white small"
                  data-prop="_history" style="max-height: 90px; overflow-y: auto;">
                  No information
                </div>
              </div>
            </div>

          </div>
        </div>


        <!-- 1. KHỐI PLAYER (NGƯỜI CHƠI) -->
        <div class="container p-0">
          <div class="card pm-card p-4">

            <div class="pm-header d-flex justify-content-between align-items-center">
              <div>
                <h4 class="fw-bold text-dark m-0"><i class="fa-solid fa-user-shield text-info me-2"></i>Player Info
                </h4>
                <small class="" text-secondary>Account Portfolio & Strategy </small>
              </div>
              <span
                class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2 rounded-pill">
                <i class="fa-solid fa-user fa-2xs me-1"></i>
                <span class="text-secondary fw-bold" data-prop="_name"></span>
              </span>
            </div>

            <div class="list-group list-group-flush bg-transparent">

              <!-- Số vàng -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-coins me-2 text-warning"></i>Asset</span>
                <span class="text-dark fw-bold fs-5" data-prop="_gold">0</span>
              </div>
              <!-- Trạng thái chơi -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-play me-2 text-success"></i>Play Status</span>
                <label class="pm-switch mb-0">
                  <input type="checkbox" data-prop="_isPlay" onchange="handleToggleChange(this)">
                  <span class="pm-slider"></span>
                </label>
              </div>

              <!-- isReverse -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-right-left me-2 text-danger"></i>Reverse</span>
                <label class="pm-switch mb-0">
                  <input type="checkbox" data-prop="_isReverse" onchange="handleToggleChange(this)">
                  <span class="pm-slider"></span>
                </label>
              </div>


              <!-- Tiền cược -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <!-- Bên trái: Tiêu đề dòng -->
                <span class="text-dark">
                  <i class="fa-solid fa-money-bill-transfer me-2 text-success"></i>Invest
                </span>

                <!-- Bên phải: Gom nhóm Trạng thái và Số tiền -->
                <div class="d-flex align-items-center gap-2">
                  <!-- Thẻ trạng thái Signal dạng Badge tròn, nổi bật vừa phải -->
                  <span
                    class="badge rounded-pill bg-secondary-subtle text-secondary px-2.5 py-1.5 fw-semibold small pm-badge-signal"
                    data-prop="_signal" style="font-size: 0.75rem; letter-spacing: 0.5px;">HOLD</span>

                  <!-- Thẻ hiển thị số tiền dạng số Monospace để các chữ số luôn thẳng hàng -->
                  <span class="text-dark fw-bold font-monospace" data-prop="_bet" style="font-size: 0.95rem;">0</span>
                </div>
              </div>


              <!-- Khoi luong -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-arrow-up-wide-short me-2 text-success"></i>
                  Volume
                </span>
                <input type="number"
                  class="form-control form-control-sm bg-white text-success fw-bold border-light-subtle text-end w-50"
                  id="_volume" value="10000" step="5000">
              </div>


              <!-- Take Profit (TP) -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-arrow-trend-up me-2 text-success"></i>
                  TP
                  <small class="text-info ms-2">10M</small>

                </span>
                <input type="number"
                  class="form-control form-control-sm bg-white text-success fw-bold border-light-subtle text-end w-50"
                  data-prop="_tp" oninput="handleInputChange(this)" value="10000000" step="500000">
              </div>

              <!-- Stop Loss (SL) -->
              <div class="list-group-item pm-item d-flex justify-content-between align-items-center py-3 px-3">
                <span class="text-dark"><i class="fa-solid fa-arrow-trend-down me-2 text-danger"></i>
                  SL
                  <small class="text-info ms-2">0</small>
                </span>
                <input type="number"
                  class="form-control form-control-sm bg-white text-danger fw-bold border-light-subtle text-end w-50"
                  data-prop="_sl" oninput="handleInputChange(this)" value="0" step="500000">
              </div>



            </div>

          </div>
        </div>


      </div>

    </div>
  </main>
  <script src="./frontend/a_globalfunc.js"></script>
  <script src="./frontend/b_echart.js"></script>
  <script src="./frontend/new.js"></script>
</body>

</html>
