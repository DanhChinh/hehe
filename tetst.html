<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Numbers Color Map</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .item {
        width: 100px;
        height: 100px;
        border: 1px solid #ccc;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h2>10 số ngẫu nhiên từ -1000 đến 1000</h2>

<div class="container" id="container"></div>

<script>
function getColor(value) {
    value = Math.max(-1000, Math.min(1000, value));

    let r, g, b;

    if (value < 0) {
        // Đen -> Trắng
        const t = (value + 1000) / 1000;

        r = Math.round(255 * t);
        g = Math.round(255 * t);
        b = Math.round(255 * t);
    } else {
        // Trắng -> Xanh lá đậm (#006400)
        const t = value / 1000;

        r = Math.round(255 * (1 - t));
        g = Math.round(255 * (1 - t) + 100 * t);
        b = Math.round(255 * (1 - t));
    }

    return `rgb(${r}, ${g}, ${b})`;
}

function getTextColor(value) {
    return value < -300 ? "#fff" : "#000";
}

const numbers = Array.from({ length: 20 }, (_, i) =>
    Math.round(1000 - i * (2000 / 19))
);

console.log(numbers);

const container = document.getElementById("container");

numbers.forEach(num => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = num;
    div.style.backgroundColor = getColor(num);
    div.style.color = getTextColor(num);

    container.appendChild(div);
});

console.log(numbers);
</script>

</body>
</html>
